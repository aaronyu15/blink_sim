image_width: 320
image_height: 320
use_gpu: false  # Enable GPU rendering (set to false to use CPU only)
num_cpu_threads: 8  # CPU worker threads for Blender rendering and Python post-processing
use_humans: true  # Enable human rendering mode
save_blend_file: true  # Save .blend file for debugging
save_hdr: false
save_hdr_mp4: false
save_rgb_reference: true
save_rgb_event_input: true
event_noise_enabled: true  # Inject salt-and-pepper DVS-like background noise
event_noise_rate: 50000      # Salt-and-pepper noise rate in events per second (independent of event count)

# Human model and animation directories
human_model_dir: 'data/human_models'
human_anim_dir: 'data/human_animations/train'
active_human_models: ['girl1_clean']  # Optional list of model basenames to include; empty means all
active_human_anims: ['01_01_forward_jump']    # Optional list of animation basenames to include; empty means all
clips_per_character: 1  # 0 means default to seq_range length; otherwise controls clips per active model.

# HDR environment for lighting
hdr_dir: 'data/haven/hdris/'


# Keep imported character transform untouched; randomization comes from camera motion.
camera_target: [0.0, 0.0, 0.0]
camera_cube_extent: 40.0  # Half-side length of cube around origin (±25 in X and Y)
camera_z_range: [5.0, 40.0]  # Z range for upper half of cube
camera_pitch_z_reference: 8.0  # Z height where pitch = camera_pitch_base_deg (typically 90° for straight down)
camera_pitch_base_deg: 90.0  # Pitch angle in degrees at z_reference; Y rot = 0, X rot = pitch
camera_pitch_scale_per_unit_z: 2.0  # Change in pitch per unit of Z above/below reference (degrees/unit)
camera_pitch_max_z_lookat_origin: 25.0  # At/above this Z, ignore pitch curve and point directly at camera_target

# Legacy fields (kept for compatibility; not used by current human import path)
human_x_offset: [0, 0]
human_distance: [5, 5]
human_z_offset: [0, 0]
human_z_rotation: [0, 0]
# Animation settings
use_cycles: True
animation_mode: 'linear'
duration: 10.0  # Config duration in seconds (fallback or cap)
clamp_duration_to_animation: true  # When true, render min(config duration, animation length). When false, always render full animation.
trim_initial_rgb_frames: 3  # Skip initial N frames (e.g., T-pose settling); still renders full duration but exports frame_N onward
event_image_fps: 300 # FPS for event simulation
rgb_image_fps: 30  # FPS for RGB frames
num_keyframes: 2
locomotion_keywords: ['run','walk','jog','sprint']
locomotion_yaw_choices: [-1.57, 1.57]
locomotion_start_offset: 4.0
loop_locomotion: false
use_fill_light: true
fill_light_position_mode: 'cube_random'  # 'camera_offset' or 'cube_random'
fill_light_cube_full_z: true  # If true, sample Z in [-camera_cube_extent, camera_cube_extent]
fill_light_cube_min_separation: 5.0  # Keep light at least this far from camera in cube_random mode
fill_light_cube_max_attempts: 30
fill_light_energy: [0, 100]
fill_light_distance: 1.0
fill_light_height: 0.75
fill_light_size: 1.0

# Sequence range
seq_range: [0, 1]
train_split_ratio: 1.0

# Not used in human mode but required by config parser
world_length: 50
world_width: 50
canopy_height: 30
canopy_distance: 20
shape_num: [1, 1]
activte_range_for_dynamic_obj: [7, 8, 5]
num_static_obj: [0, 0]
image_dir: 'data/ADE20K_2021_17_01//'
shape_dir: 'data/ShapeNetCore.v2/'
texture_split_file: 'configs/ade20k_example.json'
dynamic_obj_split_file: 'configs/shapenet_example.json'
min_hsv_range: [1.0, 1.0]
max_hsv_range: [1.0, 1.0]
hsv_dark_prob: 0.00
